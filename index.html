<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>Walentynka 💖</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            font-family: Arial, sans-serif;
            position: relative;
        }

        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            z-index: 2;
        }

        h1 {
            color: #e63946;
            margin-bottom: 30px;
        }

        .buttons {
            position: relative;
            width: 300px;
            height: 80px;
            margin: 0 auto;
        }

        button {
            font-size: 18px;
            padding: 15px 30px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.3s ease, left 0.5s ease, top 0.5s ease;
            position: absolute;
        }

        #yes {
            background-color: #ff4d6d;
            color: white;
            left: 0;
            top: 0;
            z-index: 2;
        }

        #no {
            background-color: #adb5bd;
            color: white;
            left: 150px;
            top: 0;
            z-index: 1;
        }

        /* SERDUSZKA */
        .heart {
            position: absolute;
            bottom: -20px;
            font-size: 24px;
            animation: floatUp 6s linear forwards;
            opacity: 0.8;
            pointer-events: none;
        }

        @keyframes floatUp {
            to {
                transform: translateY(-110vh) scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Czy zostaniesz moją walentynką? 💖</h1>
        <div class="buttons">
            <button id="yes" onclick="yesClick()">TAK 💘</button>
            <button id="no">NIE 💔</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById("no");
        const yesBtn = document.getElementById("yes");

        // zapamiętanie pozycji startowej NIE
        const startLeft = noBtn.offsetLeft;
        const startTop = noBtn.offsetTop;

        let returnTimeout;

        // NIE UCIEKA + WRACA PO CZASIE
        noBtn.addEventListener("mouseenter", () => {
            clearTimeout(returnTimeout);

            const padding = 20;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            const x = Math.random() * maxX;
            const y = Math.random() * maxY;

            noBtn.style.position = "fixed";
            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";

            // wraca po 1.5s
            returnTimeout = setTimeout(() => {
                noBtn.style.position = "absolute";
                noBtn.style.left = startLeft + "px";
                noBtn.style.top = startTop + "px";
            }, 1500);
        });

        // TAK ROŚNIE I POŻERA NIE
        let scaleYes = 1;
        const eatInterval = setInterval(() => {
            scaleYes += 0.05;
            yesBtn.style.transform = `scale(${scaleYes})`;

            if (scaleYes > 2.2) {
                noBtn.style.display = "none";
            }
        }, 1000);

        function yesClick() {
            document.body.innerHTML = `
            <div style="
                height:100vh;
                display:flex;
                justify-content:center;
                align-items:center;
                background: linear-gradient(135deg, #ff9a9e, #fad0c4);
                font-family: Arial;
                text-align:center;
            ">
                <h1 style="color:white; font-size:48px;">
                    Wiedziałem! 💕<br>KOCHAM CIE KSIĘŻNICZKO 😘
                </h1>
            </div>
        `;
        }

        // SERDUSZKA
        function createHeart() {
            const heart = document.createElement("div");
            heart.className = "heart";
            heart.textContent = "❤️";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = (20 + Math.random() * 20) + "px";
            heart.style.animationDuration = (4 + Math.random() * 3) + "s";

            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 7000);
        }

        setInterval(createHeart, 500);
    </script>

</body>

</html>
